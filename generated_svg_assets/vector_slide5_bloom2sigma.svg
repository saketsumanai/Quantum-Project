<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#08080f; font-family:'Segoe UI', -apple-system, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="classicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
