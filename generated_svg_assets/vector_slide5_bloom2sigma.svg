  <text x="745" y="318" fill="#94a3b8" font-size="9.5">Overcoming the English barrier with Sarvam AI dubbing in 10+ languages.</text>

  <rect x="725" y="340" width="400" height="65" rx="8" fill="#181828" stroke="#fbbf24" stroke-width="1" />
