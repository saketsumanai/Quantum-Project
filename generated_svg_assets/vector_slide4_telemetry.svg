  <text x="850" y="143" fill="#00f0ff" font-size="14" font-weight="800">98.5%</text>
  <text x="910" y="143" fill="#64748b" font-size="11">QuantumLeap (76-Book RAG)</text>

  <rect x="50" y="155" width="617" height="20" rx="5" fill="url(#greyBar)" />
